<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>くみこイラスト素材庫</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Yu Gothic","YuGothic","Hiragino Kaku Gothic ProN",sans-serif; background:#f6f1f9; color:#4a4446; padding:30px 18px 60px;}
h1{font-size:18px; color:#1d3149; text-align:center; margin-bottom:4px;}
p.l{font-size:11.5px; color:#8a97a5; text-align:center; margin-bottom:22px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; max-width:860px; margin:0 auto;}
.c{background:#fff; border-radius:16px; padding:14px 10px; text-align:center; box-shadow:0 6px 18px rgba(38,64,95,.08);}
.c img{max-width:100%; height:120px; object-fit:contain; background:repeating-conic-gradient(#f3eef7 0% 25%, #fff 0% 50%) 0 0/16px 16px; border-radius:10px;}
.c b{display:block; font-size:12px; color:#26405f; margin-top:8px;}
.c small{font-size:10px; color:#9aa7b4;}
</style>
</head>
<body>
<h1>くみこイラスト素材庫</h1>
<p class="l">Merone制作物用・透過済み</p>
<div class="grid">
<div class="c"><img src="lab-peace.png"><b>lab-peace</b><small>ピース全身</small></div>
<div class="c"><img src="lab-typing.png"><b>lab-typing</b><small>PC作業（眼鏡）</small></div>
<div class="c"><img src="lab-think.png"><b>lab-think</b><small>考え中</small></div>
<div class="c"><img src="kobushi-peace.webp"><b>kobushi-peace</b><small>ピース全身</small></div>
<div class="c"><img src="kobushi-cheers.webp"><b>kobushi-cheers</b><small>乾杯</small></div>
<div class="c"><img src="kobushi-serve.webp"><b>kobushi-serve</b><small>料理運び</small></div>
<div class="c"><img src="kobushi-cook.webp"><b>kobushi-cook</b><small>調理中</small></div>
<div class="c"><img src="kobushi-wink.webp"><b>kobushi-wink</b><small>ウインク</small></div>
<div class="c"><img src="kobushi-anim.webp"><b>kobushi-anim</b><small>透過アニメ（6ポーズ）</small></div>
</div>
</body>
</html>
